# A drop-in for the Music Player Daemon that the service's MPD channels play from.
# Install it as /etc/systemd/system/mpd.service.d/no-io-uring.conf, then:
#   systemctl daemon-reload && systemctl restart mpd
#
# MPD 0.24 keeps an io_uring request pending for as long as it runs, and its io thread waits
# on it. The kernel counts that wait as I/O wait, so pressure-stall information (PSI) reports the
# machine, or the container MPD runs in, at close to 100% I/O pressure while the disk is idle.
# Proxmox shows this in its I/O pressure graph. Nothing is actually slow, but the false reading
# hides a real I/O problem, because one would look exactly the same.
#
# Blocking io_uring_setup makes MPD fall back to ordinary reads. ENOSYS is what a kernel without
# io_uring returns, and MPD handles it. Keep SystemCallErrorNumber: without it, systemd KILLS
# the process on its first io_uring call instead of returning an error.
#
# Verified on MPD 0.24: with the drop-in, MPD opens no io_uring instance, I/O pressure stays at
# 0, and playback from local files and an httpd output runs normally.
[Service]
SystemCallFilter=~io_uring_setup
SystemCallErrorNumber=ENOSYS
