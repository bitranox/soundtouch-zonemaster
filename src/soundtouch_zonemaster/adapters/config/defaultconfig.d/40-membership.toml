# Who is allowed into the zone, and when a box stops counting as being in it.
#
# Membership is decided from what the speakers said and nothing else. These two settings are the
# only house policy laid over that.

[membership]

# Device ids of Lifestyle consoles that may be taken into the zone anyway.
#
# A PREFERENCE: a value set in the house database with "soundtouch-zonemaster-service prefs set
# membership.consoles_allowed <json>" overrides this file, the environment and the command line for
# as long as it is set. A running service reads the new list within about a second: a console taken
# OFF the list is let go at the next pass, and a console put ON it makes the service read the
# speaker registry at once and ask the console what it is playing - one already playing the house's
# stream is taken in straight away, one asleep the next time it wakes, and one playing something of
# its own stays out, as any box on its own station does, until it is switched on. "prefs unset
# membership.consoles_allowed" gives the decision back to the layers. "config" shows which of the
# two is in force.
#
# Default: [] - no console is ever joined. Effect: a console is otherwise left out and not even
# watched, because an API POWER flips its INPUT rather than waking it, so a service that reached
# one would change what somebody is doing in that room, audibly, and undoing it needs a person at
# the console.
# When to set: only when somebody who uses that room has agreed to it, naming that console's
# twelve hex digits (either case; it is stored upper case).
# Consequence: the console joins and leaves like any other box, including being sent the zone
# document. There is no way to make that quieter, which is why it is off by default and per-device
# rather than a boolean.
#   env: SOUNDTOUCH_ZONEMASTER___MEMBERSHIP__CONSOLES_ALLOWED (as JSON, e.g. '["AABBCC001122"]')
consoles_allowed = []

# How long a speaker may say nothing before it stops counting as a member, in seconds.
#
# Default: 900.0, fifteen minutes. Effect: a box that has gone quiet for longer is dropped from
# the zone WITHOUT being sent anything, because the document that takes a box out of a zone is
# the one that puts it into standby.
# When to lower it: a house where boxes are unplugged rather than switched off, and a stale member
# in the list is confusing. Do not go below a few minutes.
# Consequence of lowering it too far: an idle box says nothing for a long time quite legitimately,
# so a short timeout takes a working room out of the group for no reason and it only comes back
# when somebody touches it.
# Consequence of raising it: a box that is genuinely gone stays listed for longer. That costs
# nothing audible, which is why the default errs high.
#   env: SOUNDTOUCH_ZONEMASTER___MEMBERSHIP__UNREACHABLE_TIMEOUT_S
unreachable_timeout_s = 900.0
