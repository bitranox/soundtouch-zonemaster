# The files the service kept before there was a house database.
#
# Each is imported ONCE into an empty database and then renamed to <name>.imported, so they only
# matter on the first start after an upgrade. The database itself is [database] url.

[files]

# The channel list as a file, from before the database. Imported once if the database holds no
# channel list, then renamed. A file that exists but cannot be parsed REFUSES the start.
#   env: SOUNDTOUCH_ZONEMASTER___FILES__CHANNEL_FILE
# channel_file = "/var/lib/zonemaster/channels.json"

# The switch as a file, from before the database. Imported once if the database has never been
# switched, then renamed. Afterwards the switch is `soundtouch-zonemaster-service switch off|on`,
# and the service says so in its log if this file appears again.
#   env: SOUNDTOUCH_ZONEMASTER___FILES__SWITCH_FILE
# switch_file = "/var/lib/zonemaster/zone.switch"

# The remembered state as a file, from before the database. Imported once if the database holds
# no state, then renamed.
#   env: SOUNDTOUCH_ZONEMASTER___FILES__STATE_FILE
# state_file = "/var/lib/zonemaster/zone-state.json"
