# How quickly the switch row in the house database is noticed.

[switch]

# How often the switch row is read, in seconds.
#
# Default: 1.0. Effect: it bounds how long after `switch off` sets the row the house actually
# stands down, and how long after `switch on` sets it back it comes back.
# When to change it: rarely. One second is about as fast as somebody can walk back into the room,
# which is the timescale that matters for the one setting a person changes expecting to HEAR the
# result.
# Consequence of raising it: the delay between flipping the switch and the house reacting grows,
# and a person who does not hear anything tends to flip it again.
# Consequence of lowering it: one extra read of the switch row per second, which is free on
# SQLite and cheap on PostgreSQL, and no benefit a person can perceive.
#   env: SOUNDTOUCH_ZONEMASTER___SWITCH__POLL_S
poll_s = 1.0
