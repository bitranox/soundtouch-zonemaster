syntax = "proto2";

package Deezer;

import "ProtoToMarkup/MarkupOptions.proto";
import "DeezerContentType.proto";

message QueuedTrack {
  optional string trackid = 1;
  optional .Deezer.ContentType contentType = 2;
  optional int64 stationId = 3;
  optional string name = 4;
  optional bool readable = 5;
}
