syntax = "proto2";

package WebInterface;

import "Common.proto";

message NetStats {
  message Devices {
    optional .WebInterface.NetStats.Device device = 1;
  }
  message Bindings {
    optional .Common.String ipv4address = 1;
  }
  message Interface {
    optional .Common.String name = 1;
    optional .Common.String macAddr = 2;
    optional .WebInterface.NetStats.Bindings bindings = 3;
    optional .Common.String running = 4;
    optional .Common.String kind = 5;
    optional .Common.String ssid = 6;
    optional .Common.String rssi = 7;
    optional .Common.String frequencyKHz = 8;
  }
  message Interfaces {
    repeated .WebInterface.NetStats.Interface interface = 1;
  }
  message Device {
    optional string deviceID = 1;
    optional .Common.String deviceSerialNumber = 2;
    optional .WebInterface.NetStats.Interfaces interfaces = 3;
  }
  message Pair {
    optional string name = 1;
    optional string value = 2;
  }
  message Hop {
    optional string addr = 1;
    optional string duration = 2;
  }
  message ReachTest {
    optional string protocol = 1;
    optional string port = 2;
    optional .Common.String destination = 3;
    optional .WebInterface.NetStats.Hop hop = 4;
  }
  message Measurements {
    repeated .WebInterface.NetStats.Pair pair = 1;
    repeated .WebInterface.NetStats.ReachTest reachtest = 2;
  }
  message Header {
    optional .Common.String started = 1;
    optional .Common.String duration = 2;
  }
  message Snapshot {
    optional string deviceIDRef = 1;
    optional .WebInterface.NetStats.Header header = 2;
    optional .WebInterface.NetStats.Measurements measurements = 3;
  }
  message Snapshots {
    optional .WebInterface.NetStats.Snapshot snapshot = 1;
  }
  optional .WebInterface.NetStats.Devices devices = 1;
}
