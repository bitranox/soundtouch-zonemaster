syntax = "proto2";

package IHeart;

import "ProtoToMarkup/MarkupOptions.proto";

message Station {
  optional string band = 1;
  optional string description = 5;
  optional int32 id = 7;
  optional string logo = 8;
  optional string name = 9;
  optional string newlogo = 14;
}

message FeaturedStation {
  message Artist {
    optional int32 id = 1;
    optional string name = 2;
    optional string imagePath = 3;
  }
  optional int32 id = 1;
  optional string stationType = 2;
  optional string name = 3;
  optional string description = 4;
  optional string subHeading = 5;
  optional string imagePath = 7;
}
