syntax = "proto2";

package SoundTouchInterface;

import "ProtoToMarkup/MarkupOptions.proto";
import "SoundTouchInterface/ContentItem.proto";

message recents {
  message Recent {
    required string deviceID = 1;
    required uint64 utcTime = 2;
    required .SoundTouchInterface.ContentItem contentItem = 3;
    optional uint64 id = 4;
  }
  repeated .SoundTouchInterface.recents.Recent recent = 1;
}
