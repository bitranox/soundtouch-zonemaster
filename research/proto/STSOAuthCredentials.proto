syntax = "proto2";

package STS;

import "ProtoToMarkup/MarkupOptions.proto";

message OAuthCredentialsRequest {
  optional string code = 1;
  optional uint32 version = 2;
}

message OAuthCredentialsResponse {
  optional string user = 1;
  optional string refreshToken = 2;
  optional string displayName = 3;
  optional string oAuthId = 4;
  optional string accessToken = 5;
  optional string oAuthEmail = 6;
  optional string oAuthProvider = 7;
}
