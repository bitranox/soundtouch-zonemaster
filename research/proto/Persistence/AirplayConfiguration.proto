syntax = "proto2";

package Persistence;

import "Common.proto";

enum WifiProfileId {
  WIFI_PROFILE_ID_1 = 1;
  WIFI_PROFILE_ID_2 = 2;
  WIFI_PROFILE_ID_3 = 3;
  WIFI_PROFILE_ID_4 = 4;
  INVALID_WIFI_PROFILE_ID = 5;
}

enum DhcpActiveStatus {
  DHCP_ACTIVE = 0;
  USE_STATIC_IP_ADDRESS = 1;
  INVALID_DHCP_ACTIVE_STATUS = 2;
}

enum ProxyServerStatus {
  PROXY_SERVER_DISABLED = 0;
  PROXY_SERVER_ENABLED = 1;
  INVALID_PROXY_SERVER_STATUS = 2;
}

message AirplayConfiguration {
  message MaxWifiProfileIdTag {
    optional .Persistence.WifiProfileId text = 1 [default = INVALID_WIFI_PROFILE_ID];
  }
  message WifiProfileArrayTag {
    message ItemTag {
      optional .Persistence.WifiProfileId text = 1 [default = INVALID_WIFI_PROFILE_ID];
    }
    repeated .Persistence.AirplayConfiguration.WifiProfileArrayTag.ItemTag Item = 1;
  }
  message PersistentWifiProfileArrayTag {
    message PersistentWifiProfileTag {
      optional string ssid = 1;
      optional string passphrase = 2;
      optional string wpaCipher = 3;
      optional string security = 4;
      optional string wepKey = 5;
      optional bool encrypted = 6;
      optional .Persistence.DhcpActiveStatus dhcpStatus = 7;
      optional string ipAddress = 8;
      optional string ipMask = 9;
      optional string ipGateway = 10;
      optional .Persistence.ProxyServerStatus proxyServerStatus = 11;
      optional string proxyServer = 12;
      optional string proxyPort = 13;
      optional string dnsServer1 = 14;
      optional string dnsServer2 = 15;
    }
    repeated .Persistence.AirplayConfiguration.PersistentWifiProfileArrayTag.PersistentWifiProfileTag PersistentWifiProfile = 1;
  }
  message CneSetting {
    optional string path = 1;
    optional string value = 2;
  }
  message CneSettingsMsg {
    repeated .Persistence.AirplayConfiguration.CneSetting setting = 1;
    optional bool cneSettingsPreserved = 2;
  }
  message PersistenceSetting {
    optional string parameter = 1;
    optional .Persistence.AirplayConfiguration.PersistenceSettingsType type = 2;
    optional string value = 3;
    optional bool stored = 4;
  }
  message PersistenceSettingsMsg {
    repeated .Persistence.AirplayConfiguration.PersistenceSetting setting = 1;
    optional bool persistenceSettingsPreserved = 2;
  }
  enum PersistenceSettingsType {
    INTEGER = 1;
    STRING = 2;
  }
  optional .Common.BoolTrue WifiRadioOn = 1;
  optional .Persistence.AirplayConfiguration.MaxWifiProfileIdTag MaxWifiProfileId = 2;
  optional .Persistence.AirplayConfiguration.WifiProfileArrayTag WifiProfileArray = 3;
  optional .Common.Bool JBDirectEnabled = 4;
  optional .Persistence.AirplayConfiguration.PersistentWifiProfileArrayTag PersistentWifiProfileArray = 5;
  optional .Persistence.AirplayConfiguration.CneSettingsMsg CneSettings = 6;
  optional .Persistence.AirplayConfiguration.PersistenceSettingsMsg PersistenceSettings = 7;
  optional bool SmscUpdating = 8;
  optional uint32 RestoreAttempts = 9;
  optional bool BCOResetTimerEnabled = 10 [default = false];
}
