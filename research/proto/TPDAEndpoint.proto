syntax = "proto2";

package TPDA;

import "ProtoToMarkup/MarkupOptions.proto";

message Endpoint {
  message CookieEntry {
    optional string key = 1;
    optional string value = 2;
  }
  message Scope {
    optional string token = 1;
    optional string type = 2;
  }
  optional string endpointId = 1;
  repeated .TPDA.Endpoint.CookieEntry cookie = 2;
  optional .TPDA.Endpoint.Scope scope = 3;
}
