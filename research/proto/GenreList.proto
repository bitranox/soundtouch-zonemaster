syntax = "proto2";

package IHeart;

import "ProtoToMarkup/MarkupOptions.proto";

message GenreList {
  message Genre {
    optional int32 id = 1;
    optional string name = 2;
    optional string logo = 3;
    optional bool display = 5;
  }
  optional int32 total = 2;
  repeated .IHeart.GenreList.Genre hits = 3;
}
