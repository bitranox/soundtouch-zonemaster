syntax = "proto2";

package LocalMusic;

import "ProtoToMarkup/MarkupOptions.proto";
import "LocalMusicError.proto";
import "LocalMusicAlbumInfo.proto";
import "LocalMusicArtistInfo.proto";
import "LocalMusicPodcastInfo.proto";
import "LocalMusicAuthorInfo.proto";
import "Common.proto";

message links {
  optional .Common.Link stream = 1;
}

message embedded {
  optional .LocalMusic.AlbumInfo album = 1;
  optional .LocalMusic.ArtistInfo artist = 2;
  optional .LocalMusic.PodcastInfo podcast = 3;
  optional .LocalMusic.AuthorInfo author = 4;
}

message TrackInfo {
  optional int64 id = 1;
  optional string name = 2;
  optional int64 duration = 3;
  optional string format = 4;
  optional string url = 5;
  optional .LocalMusic.error error = 6;
  optional int64 trackNumber = 7;
  optional bool compilation = 8;
  optional string genre = 9;
  optional int64 bitrate = 10;
  optional int64 sampleRate = 11;
  optional .LocalMusic.links _links = 12;
  optional .LocalMusic.embedded _embedded = 13;
}
